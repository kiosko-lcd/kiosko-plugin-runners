# A synthetic gitlab-runner config.toml. The tokens are fakes made for the
# tests: they must never come out of the parser.
concurrent = 4
check_interval = 0
listen_address = ":9252"
shutdown_timeout = 0

[session_server]
  session_timeout = 1800
  listen_address = "0.0.0.0:8093"

[[runners]]
  name = "desktop docker"
  url = "https://ci-user:FAKE-PASSWORD-ZZZ@gitlab.example.com/"
  id = 41
  token = "glrt-FAKE-TOKEN-DO-NOT-LEAK-0123456789"
  token_obtained_at = 2026-11-01T10:00:00Z
  token_expires_at = 0001-01-01T00:00:00Z
  executor = "docker"
  limit = 2
  environment = ["SECRET_KEY=FAKE-ENV-SECRET-ZZZ"]
  [runners.custom_build_dir]
  [runners.cache]
    MaxUploadedArchiveSize = 0
    Type = "s3"
    [runners.cache.s3]
      ServerAddress = "s3.example.com"
      AccessKey = "FAKE-ACCESS-KEY-ZZZ"
      SecretKey = "FAKE-SECRET-KEY-ZZZ"
      BucketName = "runner"
  [runners.docker]
    tls_verify = false
    image = "alpine:3"
    privileged = false
    disable_cache = false
    volumes = ["/cache"]
    shm_size = 0
    network_mtu = 0

[[runners]]
  name = 'second'
  url = "https://gitlab.com"
  token = 'glrt-SECOND-FAKE-TOKEN-ZZZ'
  executor = "shell"
